# Skyramp Workspace Configuration
workspace:
  repoName: pellepedro-testbot/infisical
  repoUrl: https://github.com/pellepedro-testbot/infisical
metadata:
  schemaVersion: v1
  mcpVersion: next
  executorVersion: v1.3.30
  createdAt: "2026-07-02T00:00:00.000Z"
  updatedAt: "2026-07-02T00:00:00.000Z"
services:
  - serviceName: infisical-api
    language: python
    framework: pytest
    testDirectory: backend/tests/skyramp
    api:
      schemaPath: http://localhost:8080/api/docs/json
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d --build
      serverStopCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . down -v
      runtime: docker
      dockerNetwork: infisical_default
  - serviceName: infisical-ui
    language: typescript
    framework: playwright
    testDirectory: frontend/tests/skyramp
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d --build
      serverStopCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . down -v
      runtime: docker
      dockerNetwork: infisical_default
