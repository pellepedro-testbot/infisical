# Skyramp Workspace Configuration
workspace:
  repoName: pellepedro-testbot/infisical
  repoUrl: https://github.com/pellepedro-testbot/infisical
metadata:
  schemaVersion: v1
  executorVersion: v1.3.30
  mcpVersion: next
  createdAt: "2026-06-30T00:01:56.155Z"
  updatedAt: "2026-06-30T00:01:56.161Z"
services:
  - serviceName: infisical-backend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/backend
    api:
      schemaPath: http://localhost:8080/api/docs/json
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d --build backend nginx
      runtime: docker
      dockerNetwork: infisical_default
  - serviceName: infisical-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/frontend
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d --build frontend nginx
      runtime: docker
      dockerNetwork: infisical_default