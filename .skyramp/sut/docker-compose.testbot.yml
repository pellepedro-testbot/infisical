services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: testbot
      POSTGRES_DB: infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infisical-testbot-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_URI=postgres://infisical:testbot@db/infisical?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=testbot-infisical-auth-secret-for-ci-testing-only
      - ENCRYPTION_KEY=testbot-infisical-encrypt-key-32
      - SITE_URL=http://localhost:8080
      - TELEMETRY_ENABLED=false
      - HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/api/status"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  nginx:
    image: nginx
    container_name: infisical-testbot-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: infisical-testbot-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
